# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#

default: &default
 adapter: postgresql
 encoding: unicode
 pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
 username: <%= ENV.fetch("DB_USERNAME") { ENV["USER"] || `whoami`.chomp } %>
 password: <%= ENV.fetch("DB_PASSWORD", "") %>
 host: <%= ENV.fetch("DB_HOST", "localhost") %>
 port: <%= ENV.fetch("DB_PORT", 5432) %>

development:
 <<: *default
 database: recipe_app_development

test:
  <<: *default
  database: recipe_app_development

production:
  primary: &primary_production
    <<: *default
    database: recipe_app_development
    username: backend
    password: <%= ENV["BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: backend_production_cable
    migrations_paths: db/cable_migrate
